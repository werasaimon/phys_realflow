<text x="509.6" y="226.8" fill="#1d4ed8" font-weight="600">B_x</text>
<text x="305" y="182" fill="#b91c1c" text-anchor="middle">E_x(i+½, j+1, k)</text>
<text x="454.8" y="132.8" fill="#b91c1c">E_z(i+1, j+1, k+½)</text>
