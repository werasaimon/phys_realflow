<text x="202" y="368" fill="#374151" text-anchor="end">(i, j, k)</text>
<text x="30" y="424" fill="#111827">Закон Фарадея в интегральной форме для верхней грани (MagneticField::applyFaraday):</text>
<text x="30" y="446" fill="#111827" font-size="14">Δx² · ∂B_y/∂t = −∮ E·dl   — сумма по четырём красным рёбрам</text>
<text x="30" y="468" fill="#374151" font-size="12">Каждое ребро входит в две соседние грани ячейки с противоположными знаками,</text>
<text x="30" y="486" fill="#374151" font-size="12">поэтому полный поток через 6 граней не меняется: div B = 0 до ошибки округления.</text>
